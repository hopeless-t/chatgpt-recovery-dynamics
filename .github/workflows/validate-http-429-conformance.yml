name: Validate HTTP 429 Local Conformance Lab

on:
  push:
    paths:
      - "data/http_429_conformance_scenarios.json"
      - "data/http_429_conformance_reference.json"
      - "data/http_429_cross_language_reference.json"
      - "data/http_429_go_cross_language_reference.json"
      - "data/http_429_metamorphic_reference.json"
      - "data/http_429_recovery_hysteresis_contract.json"
      - "data/http_429_recovery_hysteresis_scenarios.json"
      - "data/http_429_recovery_hysteresis_reference.json"
      - "scripts/http_429_recovery_hysteresis.py"
      - "scripts/http_429_recovery_hysteresis_swarm.py"
      - "data/http_429_recovery_hysteresis_metamorphic_reference.json"
      - "data/preflight_routes.json"
      - "scripts/http_429_conformance_lab.py"
      - "scripts/compare_http_429_conformance.py"
      - "scripts/http_429_conformance_node.js"
      - "scripts/http_429_conformance_go.go"
      - "scripts/generate_http_429_metamorphic_cases.py"
      - "scripts/http_429_survival.py"
      - "docs/429-conformance-lab/**"
      - "docs/purrtocol-429-peace-bridge/**"
      - ".github/workflows/validate-http-429-conformance.yml"
  pull_request:
    paths:
      - "data/http_429_conformance_scenarios.json"
      - "data/http_429_conformance_reference.json"
      - "data/http_429_cross_language_reference.json"
      - "data/http_429_go_cross_language_reference.json"
      - "data/http_429_metamorphic_reference.json"
      - "data/http_429_recovery_hysteresis_contract.json"
      - "data/http_429_recovery_hysteresis_scenarios.json"
      - "data/http_429_recovery_hysteresis_reference.json"
      - "scripts/http_429_recovery_hysteresis.py"
      - "scripts/http_429_recovery_hysteresis_swarm.py"
      - "data/http_429_recovery_hysteresis_metamorphic_reference.json"
      - "data/preflight_routes.json"
      - "scripts/http_429_conformance_lab.py"
      - "scripts/compare_http_429_conformance.py"
      - "scripts/http_429_conformance_node.js"
      - "scripts/http_429_conformance_go.go"
      - "scripts/generate_http_429_metamorphic_cases.py"
      - "scripts/http_429_survival.py"
      - "docs/429-conformance-lab/**"
      - "docs/purrtocol-429-peace-bridge/**"
      - ".github/workflows/validate-http-429-conformance.yml"
permissions:
  contents: read

jobs:
  loopback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run loopback-only conformance fire drill
        run: |
          python scripts/http_429_conformance_lab.py \
            --output /tmp/http-429-conformance.json

      - name: Run independent Node conformance fire drill
        run: |
          node scripts/http_429_conformance_node.js \
            --output /tmp/http-429-conformance-node.json

      - name: Run independent Go conformance fire drill
        run: |
          go version
          go run scripts/http_429_conformance_go.go \
            --output /tmp/http-429-conformance-go.json

      - name: Compare Python and Node contract semantics
        run: |
          python scripts/compare_http_429_conformance.py \
            --python-report /tmp/http-429-conformance.json \
            --node-report /tmp/http-429-conformance-node.json \
            --output /tmp/http-429-cross-language.json

      - name: Compare Python and Go contract semantics
        run: |
          python scripts/compare_http_429_conformance.py \
            --python-report /tmp/http-429-conformance.json \
            --node-report /tmp/http-429-conformance-go.json \
            --candidate-label go-standard-library \
            --output /tmp/http-429-python-go.json

      - name: Compare frozen Python-Go reference
        run: |
          python - <<'PY'
          import json

          with open("/tmp/http-429-python-go.json", "r", encoding="utf-8") as f:
              observed = json.load(f)
          with open("data/http_429_go_cross_language_reference.json", "r", encoding="utf-8") as f:
              reference = json.load(f)

          frozen = reference["observed"]
          for key in (
              "schema",
              "implementations",
              "scenario_count",
              "semantic_parity",
              "float_tolerance_abs",
              "ignored_as_implementation_specific",
              "errors",
          ):
              assert observed[key] == frozen[key]
          print("HTTP 429 Python-Go frozen reference: PASS")
          PY

      - name: Compare frozen cross-language reference
        run: |
          python - <<'PY'
          import json

          with open("/tmp/http-429-cross-language.json", "r", encoding="utf-8") as f:
              observed = json.load(f)
          with open("data/http_429_cross_language_reference.json", "r", encoding="utf-8") as f:
              reference = json.load(f)

          frozen = reference["observed"]
          assert observed["schema"] == frozen["schema"]
          assert observed["implementations"] == frozen["implementations"]
          assert observed["scenario_count"] == frozen["scenario_count"]
          assert observed["semantic_parity"] is frozen["semantic_parity"]
          assert observed["float_tolerance_abs"] == frozen["float_tolerance_abs"]
          assert (
              observed["ignored_as_implementation_specific"]
              == frozen["ignored_as_implementation_specific"]
          )
          assert observed["errors"] == frozen["errors"]
          print("HTTP 429 cross-language frozen reference: PASS")
          PY

      - name: Run Recovery Hysteresis Gate
        run: |
          python scripts/http_429_recovery_hysteresis.py \
            --output /tmp/http-429-recovery-hysteresis.json

      - name: Check Recovery Hysteresis invariants
        run: |
          python - <<'PY'
          import json

          r = json.load(open("/tmp/http-429-recovery-hysteresis.json", encoding="utf-8"))
          assert r["schema"] == "http-429-recovery-hysteresis-report/v1"
          assert r["experiment_id"] == "NET-429-HYS-001"
          assert r["classification"] == "deterministic_state_machine_lab_not_provider_behavior"
          assert r["summary"] == {"scenarios": 8, "passed": 8, "failed": 0}
          assert r["policy"] == {
              "confirmation_successes_required": 2,
              "minimum_recovering_duration_s": 5.0,
              "production_recommendation": False,
          }
          assert r["invariants"] == {
              "first_success_after_blocked_is_recovering": True,
              "first_success_resets_failure_history": False,
              "recovering_429_returns_blocked": True,
              "healthy_requires_configured_stability_confirmation": True,
              "failure_history_reset_only_on_e_to_h": True,
          }
          assert r["safety"] == {
              "production_traffic": False,
              "network_access": False,
              "operation_replay_authority": False,
          }

          by_id = {row["scenario_id"]: row for row in r["results"]}
          assert by_id["first-success-is-recovering"]["observed_states"] == ["E"]
          assert by_id["rebound-before-confirmation"]["observed_states"] == ["E", "B"]
          assert by_id["count-met-window-not-met"]["observed_states"] == ["E", "E"]
          assert by_id["window-met-count-met-promotes"]["observed_states"] == ["E", "H"]
          assert by_id["promote-then-reblock"]["observed_states"] == ["E", "H", "B"]

          print("HTTP 429 Recovery Hysteresis Gate: PASS (8/8)")
          PY

      - name: Compare frozen Recovery Hysteresis reference
        run: |
          python - <<'PY'
          import json

          observed = json.load(open("/tmp/http-429-recovery-hysteresis.json", encoding="utf-8"))
          reference = json.load(open("data/http_429_recovery_hysteresis_reference.json", encoding="utf-8"))

          assert reference["schema"] == "http-429-recovery-hysteresis-reference/v1"
          assert observed["experiment_id"] == reference["experiment_id"]
          assert observed["summary"] == reference["observed"]["summary"]
          assert observed["policy"] == reference["lab_policy"]
          assert observed["invariants"] == reference["observed"]["invariants"]
          assert observed["safety"] == reference["safety"]

          by_id = {row["scenario_id"]: row for row in observed["results"]}
          for scenario_id, states in reference["observed"]["state_sequences"].items():
              assert by_id[scenario_id]["observed_states"] == states
          for scenario_id, resets in reference["observed"]["failure_history_resets"].items():
              assert by_id[scenario_id]["failure_history_resets"] == resets

          assert reference["interpretation"]["universal_rebound_claim"] == "NOT_ESTABLISHED"
          assert reference["interpretation"]["production_thresholds"] == "NOT_ESTABLISHED"
          assert reference["interpretation"]["provider_root_cause"] == "NOT_ESTABLISHED"

          print("HTTP 429 Recovery Hysteresis frozen reference: PASS")
          PY

      - name: Run Recovery Hysteresis Metamorphic Kitten Swarm
        run: |
          python scripts/http_429_recovery_hysteresis_swarm.py \
            --output /tmp/http-429-recovery-hysteresis-swarm.json

      - name: Check Recovery Hysteresis Metamorphic relations
        run: |
          python - <<'PY'
          import json

          r = json.load(open(
              "/tmp/http-429-recovery-hysteresis-swarm.json",
              encoding="utf-8",
          ))
          assert r["schema"] == "http-429-recovery-hysteresis-metamorphic-report/v1"
          assert r["experiment_id"] == "NET-429-HYS-002"
          assert r["classification"] == (
              "deterministic_state_machine_metamorphic_lab_not_provider_behavior"
          )
          assert r["generator"]["id"] == "hysteresis-metamorphic-kitten-swarm-v1"
          assert r["generator"]["deterministic"] is True
          assert r["generator"]["policy_count"] == 12
          assert r["generator"]["confirmation_counts"] == [2, 3, 4]
          assert r["generator"]["minimum_recovering_durations_s"] == [0.0, 2.0, 5.0, 10.0]
          assert r["generator"]["relation_checks"] == 84
          assert set(r["generator"]["relation_families"]) == {
              "first_success_is_recovering",
              "recovering_429_rebounds_to_blocked",
              "exact_boundary_promotes_once",
              "stricter_count_cannot_promote_earlier",
              "stricter_duration_cannot_promote_earlier",
              "time_translation_preserves_semantics",
              "post_healthy_success_does_not_reset_again",
          }
          assert set(r["generator"]["relation_families"].values()) == {12}
          assert r["summary"] == {
              "relation_checks": 84,
              "passed": 84,
              "failed": 0,
          }
          assert r["safety"] == {
              "production_traffic": False,
              "network_access": False,
              "operation_replay_authority": False,
          }
          print("HTTP 429 Recovery Hysteresis Metamorphic Kitten Swarm: PASS (84/84)")
          PY

      - name: Generate Metamorphic Kitten Swarm
        run: |
          python scripts/generate_http_429_metamorphic_cases.py \
            --output /tmp/http-429-metamorphic-scenarios.json
          python scripts/generate_http_429_metamorphic_cases.py \
            --output /tmp/http-429-metamorphic-scenarios-second.json
          cmp \
            /tmp/http-429-metamorphic-scenarios.json \
            /tmp/http-429-metamorphic-scenarios-second.json

      - name: Run Python against Metamorphic Kitten Swarm
        run: |
          python scripts/http_429_conformance_lab.py \
            --scenarios /tmp/http-429-metamorphic-scenarios.json \
            --output /tmp/http-429-metamorphic-python.json

      - name: Run Node against Metamorphic Kitten Swarm
        run: |
          node scripts/http_429_conformance_node.js \
            --scenarios /tmp/http-429-metamorphic-scenarios.json \
            --output /tmp/http-429-metamorphic-node.json

      - name: Run Go against Metamorphic Kitten Swarm
        run: |
          go run scripts/http_429_conformance_go.go \
            --scenarios /tmp/http-429-metamorphic-scenarios.json \
            --output /tmp/http-429-metamorphic-go.json

      - name: Compare swarm semantics across runtimes
        run: |
          python scripts/compare_http_429_conformance.py \
            --python-report /tmp/http-429-metamorphic-python.json \
            --node-report /tmp/http-429-metamorphic-node.json \
            --output /tmp/http-429-metamorphic-python-node.json

          python scripts/compare_http_429_conformance.py \
            --python-report /tmp/http-429-metamorphic-python.json \
            --node-report /tmp/http-429-metamorphic-go.json \
            --candidate-label go-standard-library \
            --output /tmp/http-429-metamorphic-python-go.json

      - name: Check Metamorphic Kitten Swarm invariants
        run: |
          python - <<'PY'
          import json

          scenarios = json.load(open("/tmp/http-429-metamorphic-scenarios.json", encoding="utf-8"))
          py = json.load(open("/tmp/http-429-metamorphic-python.json", encoding="utf-8"))
          node = json.load(open("/tmp/http-429-metamorphic-node.json", encoding="utf-8"))
          go = json.load(open("/tmp/http-429-metamorphic-go.json", encoding="utf-8"))
          pn = json.load(open("/tmp/http-429-metamorphic-python-node.json", encoding="utf-8"))
          pg = json.load(open("/tmp/http-429-metamorphic-python-go.json", encoding="utf-8"))

          assert scenarios["schema"] == "http-429-metamorphic-scenarios/v1"
          assert scenarios["generator"]["id"] == "metamorphic-kitten-swarm-v1"
          assert scenarios["generator"]["deterministic"] is True
          assert scenarios["generator"]["case_count"] == 30
          assert scenarios["generator"]["families"] == {
              "retry_after_floor": 6,
              "fast_fail_anchor": 6,
              "draft_zero_window": 6,
              "retry_after_precedence": 6,
              "budget_stop": 6,
          }
          assert scenarios["safety"] == {
              "network_scope": "loopback_only",
              "allowed_host": "127.0.0.1",
              "production_traffic": False,
          }
          assert scenarios["ambiguous"] == []

          for report in (py, node, go):
              assert report["summary"]["scenarios"] == 30
              assert report["summary"]["passed"] == 30
              assert report["summary"]["failed"] == 0
              assert report["safety"] == {
                  "production_traffic": False,
                  "rate_limit_evasion": False,
                  "remote_target_input": False,
              }

          assert pn["scenario_count"] == 30
          assert pn["semantic_parity"] is True
          assert pn["errors"] == []
          assert pg["scenario_count"] == 30
          assert pg["semantic_parity"] is True
          assert pg["errors"] == []

          # The generated family itself remains free of duplicated logical IDs.
          op_ids = [row["operation_id"] for row in scenarios["scripted"]]
          assert len(op_ids) == len(set(op_ids)) == 30

          print("HTTP 429 Metamorphic Kitten Swarm: PASS (30/30 × 3 runtimes)")
          PY

      - name: Check frozen Metamorphic Kitten Swarm reference
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          scenario_path = Path("/tmp/http-429-metamorphic-scenarios.json")
          scenarios = json.loads(scenario_path.read_text(encoding="utf-8"))
          py = json.load(open("/tmp/http-429-metamorphic-python.json", encoding="utf-8"))
          node = json.load(open("/tmp/http-429-metamorphic-node.json", encoding="utf-8"))
          go = json.load(open("/tmp/http-429-metamorphic-go.json", encoding="utf-8"))
          pn = json.load(open("/tmp/http-429-metamorphic-python-node.json", encoding="utf-8"))
          pg = json.load(open("/tmp/http-429-metamorphic-python-go.json", encoding="utf-8"))
          reference = json.load(open("data/http_429_metamorphic_reference.json", encoding="utf-8"))

          digest = hashlib.sha256(scenario_path.read_bytes()).hexdigest()
          assert digest == reference["generator"]["scenario_sha256"]
          assert scenarios["generator"]["id"] == reference["generator"]["id"]
          assert scenarios["generator"]["case_count"] == reference["generator"]["case_count"]
          assert scenarios["generator"]["families"] == reference["generator"]["families"]

          assert py["summary"] == reference["observed"]["python"]
          assert node["summary"] == reference["observed"]["node"]
          assert go["summary"] == reference["observed"]["go"]

          assert {
              "scenario_count": pn["scenario_count"],
              "semantic_parity": pn["semantic_parity"],
              "errors": pn["errors"],
          } == reference["observed"]["python_node"]
          assert {
              "scenario_count": pg["scenario_count"],
              "semantic_parity": pg["semantic_parity"],
              "errors": pg["errors"],
          } == reference["observed"]["python_go"]

          assert reference["freeze_policy"]["freeze_raw_runtime_report_bytes"] is False
          print("HTTP 429 Metamorphic Kitten Swarm frozen reference: PASS")
          PY

      - name: Check Peace Junction reference mirrors
        run: |
          cmp \
            data/http_429_cross_language_reference.json \
            docs/purrtocol-429-peace-bridge/reference.json
          cmp \
            data/http_429_go_cross_language_reference.json \
            docs/purrtocol-429-peace-bridge/go-reference.json
          echo "Purrtocol 429 Peace Junction receipt mirrors: PASS"

      - name: Observe Peace Bridge in real Chrome
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory docs >/tmp/peace-bridge-http.log 2>&1 &
          echo $! > /tmp/peace-bridge-http.pid
          sleep 1

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"

          "$CHROME"             --headless=new             --no-sandbox             --disable-dev-shm-usage             --virtual-time-budget=4000             --dump-dom             http://127.0.0.1:8766/purrtocol-429-peace-bridge/             > /tmp/purrtocol-429-peace-bridge-dom.html

          grep -q '429 Peace' /tmp/purrtocol-429-peace-bridge-dom.html
          grep -q 'GoPaw' /tmp/purrtocol-429-peace-bridge-dom.html
          grep -q '3 / 3' /tmp/purrtocol-429-peace-bridge-dom.html
          test "$(grep -o '>TRUE<' /tmp/purrtocol-429-peace-bridge-dom.html | wc -l)" -ge 2
          test "$(grep -o '8 / 8' /tmp/purrtocol-429-peace-bridge-dom.html | wc -l)" -ge 2
          grep -q 'Visualization ≠ Evidence' /tmp/purrtocol-429-peace-bridge-dom.html

          "$CHROME"             --headless=new             --no-sandbox             --disable-dev-shm-usage             --virtual-time-budget=4000             --window-size=1200,900             --screenshot=/tmp/purrtocol-429-peace-bridge.png             http://127.0.0.1:8766/purrtocol-429-peace-bridge/

          test -s /tmp/purrtocol-429-peace-bridge.png
          echo "Purrtocol 429 Tri-Runtime Peace Junction browser observation: PASS"

      - name: Check local-network and recovery invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/http-429-conformance.json", "r", encoding="utf-8") as f:
              r = json.load(f)

          assert r["schema"] == "http-429-local-conformance-report/v1"
          assert r["classification"] == "loopback_only_conformance_not_production_evidence"
          assert r["network_scope"].startswith("127.0.0.1")
          assert r["safety"] == {
              "production_traffic": False,
              "rate_limit_evasion": False,
              "remote_target_input": False,
          }
          assert r["summary"]["scenarios"] == 8
          assert r["summary"]["passed"] == 8
          assert r["summary"]["failed"] == 0

          by_id = {row["scenario_id"]: row for row in r["results"]}

          floor = by_id["retry-after-floor"]
          assert floor["start_times_s"][1] >= 5.05

          fast = by_id["fast-fail-anchor"]
          assert min(fast["start_gaps_s"]) >= 3.0

          draft = by_id["draft-zero-window"]
          assert draft["attempts"][0]["retry_decision"]["draft_ratelimit_floor_s"] == 4.0

          precedence = by_id["retry-after-dominates-draft"]
          assert precedence["attempts"][0]["retry_decision"]["retry_after_floor_s"] == 6.0
          assert precedence["attempts"][0]["retry_decision"]["draft_ratelimit_floor_s"] == 0.0

          problem = by_id["problem-detail-is-not-control"]
          assert "Retry immediately!" in problem["attempts"][0]["body"]["detail"]
          assert problem["start_times_s"][1] >= 4.05

          budget = by_id["budget-stop"]
          assert budget["terminal"] == "STOP_BUDGET"
          assert budget["server_requests"] == 3

          unknown = by_id["unknown-post-reobserve"]
          assert unknown["decision"]["action"] == "REOBSERVE"
          assert unknown["post_requests"] == 1
          assert unknown["side_effects"] == 1
          assert unknown["reobserved_state"]["ambiguous_effects"] == 1

          explicit = by_id["explicit-contract-deduplicates"]
          assert explicit["first_decision"]["action"] == "WAIT_THEN_RETRY"
          assert explicit["post_requests"] == 2
          assert explicit["side_effects"] == 1
          assert len(set(explicit["server_operation_ids"])) == 1
          assert len(set(explicit["server_attempt_ids"])) == 2

          print("HTTP 429 loopback conformance: PASS")
          PY

      - name: Compare frozen conformance reference
        run: |
          python - <<'PY'
          import json

          with open("/tmp/http-429-conformance.json", "r", encoding="utf-8") as f:
              observed = json.load(f)
          with open("data/http_429_conformance_reference.json", "r", encoding="utf-8") as f:
              reference = json.load(f)

          assert observed == reference
          print("HTTP 429 frozen conformance reference: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: http-429-local-conformance
          path: |
            /tmp/http-429-conformance.json
            /tmp/http-429-conformance-node.json
            /tmp/http-429-conformance-go.json
            /tmp/http-429-cross-language.json
            /tmp/http-429-python-go.json
            /tmp/http-429-recovery-hysteresis.json
            data/http_429_recovery_hysteresis_reference.json
            /tmp/http-429-metamorphic-scenarios.json
            /tmp/http-429-metamorphic-scenarios-second.json
            /tmp/http-429-metamorphic-python.json
            /tmp/http-429-metamorphic-node.json
            /tmp/http-429-metamorphic-go.json
            /tmp/http-429-metamorphic-python-node.json
            /tmp/http-429-metamorphic-python-go.json
            data/http_429_go_cross_language_reference.json
            /tmp/purrtocol-429-peace-bridge-dom.html
            /tmp/purrtocol-429-peace-bridge.png
            /tmp/peace-bridge-http.log
            data/http_429_conformance_reference.json
