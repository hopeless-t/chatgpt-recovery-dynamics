name: Build paper PDF

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_paper_pdf.py"
      - "docs/paper/**"
      - "data/summary.json"
      - "data/transition_biopsy_reference.json"
      - "data/deep_validation_reference.json"
      - "data/server_congestion_reference.json"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PDF dependencies
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.3 pypdf==6.1.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Build paper candidate
        run: |
          mkdir -p /tmp/paper-candidate
          python scripts/build_paper_pdf.py             --output /tmp/paper-candidate/chatgpt-recovery-dynamics-paper.pdf

      - name: Validate PDF structure and renderability
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          p = Path("/tmp/paper-candidate/chatgpt-recovery-dynamics-paper.pdf")
          assert p.exists()
          reader = PdfReader(str(p))
          print("paper stats", len(reader.pages), p.stat().st_size)

          # Structural quality gate: enough content to be a real report,
          # without coupling acceptance to PDF compression details.
          assert p.stat().st_size > 8000
          assert len(reader.pages) >= 5

          text = "\n".join((page.extract_text() or "") for page in reader.pages)
          for phrase in [
              "ChatGPT Conversation Recovery Dynamics",
              "Recover. Don't amplify.",
              "Visualization != Evidence.",
              "Provider-friendly congestion design",
          ]:
              assert phrase in text, phrase

          print("PDF structure/text validation: PASS", len(reader.pages), p.stat().st_size)
          PY

          mkdir -p /tmp/paper-render
          pdftoppm -png -r 110             /tmp/paper-candidate/chatgpt-recovery-dynamics-paper.pdf             /tmp/paper-render/page >/dev/null

          rendered="$(find /tmp/paper-render -name 'page-*.png' | wc -l)"
          test "$rendered" -ge 5
          echo "PDF render validation: PASS ($rendered pages)"

      - name: Upload paper candidate
        uses: actions/upload-artifact@v4
        with:
          name: paper-candidate-${{ github.sha }}
          path: |
            /tmp/paper-candidate/chatgpt-recovery-dynamics-paper.pdf
            /tmp/paper-render/page-*.png
          if-no-files-found: error
          retention-days: 30
