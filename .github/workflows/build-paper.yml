name: Build paper PDF

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_paper_pdf.py"
      - "docs/paper/**"
      - "data/summary.json"
      - "data/transition_biopsy_reference.json"
      - "data/deep_validation_reference.json"
      - "data/server_congestion_reference.json"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PDF dependencies
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.3 pypdf==6.1.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Build paper
        run: python scripts/build_paper_pdf.py --output docs/paper/chatgpt-recovery-dynamics-paper.pdf

      - name: Validate PDF structure and renderability
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          p = Path("docs/paper/chatgpt-recovery-dynamics-paper.pdf")
          assert p.exists()
          assert p.stat().st_size > 30000
          reader = PdfReader(str(p))
          assert len(reader.pages) >= 7
          text = "\n".join((page.extract_text() or "") for page in reader.pages)
          for phrase in [
              "ChatGPT Conversation Recovery Dynamics",
              "Recover. Don't amplify.",
              "Visualization != Evidence.",
              "Provider-friendly congestion design",
          ]:
              assert phrase in text, phrase
          print("PDF structure/text validation: PASS", len(reader.pages), p.stat().st_size)
          PY
          mkdir -p /tmp/paper-render
          pdftoppm -png -r 110 docs/paper/chatgpt-recovery-dynamics-paper.pdf /tmp/paper-render/page >/dev/null
          test "$(find /tmp/paper-render -name 'page-*.png' | wc -l)" -ge 7
          echo "PDF render validation: PASS"

      - name: Commit generated PDF if changed
        run: |
          if git diff --quiet -- docs/paper/chatgpt-recovery-dynamics-paper.pdf && git ls-files --error-unmatch docs/paper/chatgpt-recovery-dynamics-paper.pdf >/dev/null 2>&1; then
            echo "paper PDF unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/paper/chatgpt-recovery-dynamics-paper.pdf
          git commit -m "Update generated paper PDF [skip ci]"
          git push
