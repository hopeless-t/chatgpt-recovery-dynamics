name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki-src/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout initialized Wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Mirror authored Wiki pages
        run: |
          rsync -a --delete --exclude=".git" project/wiki-src/ wiki/

      - name: Commit Wiki if changed
        working-directory: wiki
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "wiki is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync research Wiki from main @ ${GITHUB_SHA::7}"
          git push
