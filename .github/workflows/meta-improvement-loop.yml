name: Meta Improvement Loop

on:
  push:
    paths:
      - "data/improvement_events.jsonl"
      - "data/meta_improvement_loop_policy.json"
      - "docs/repository-observatory/critic-router.md"
      - "scripts/preflight_router.py"
      - "data/preflight_routes.json"
      - "data/meta_improvement_event_schema.json"
      - "data/meta_improvement_events.jsonl"
      - "scripts/analyze_improvement_loop.py"
      - "scripts/check_branch_convergence.py"
      - "data/critic_router_v1_evaluation.json"
      - "docs/repository-observatory/branch-convergence.md"
      - "META_IMPROVEMENT_LOOP.md"
      - ".github/workflows/meta-improvement-loop.yml"
  pull_request:
    paths:
      - "data/improvement_events.jsonl"
      - "data/meta_improvement_loop_policy.json"
      - "data/meta_improvement_events.jsonl"
      - "data/meta_improvement_event_schema.json"
      - "data/preflight_routes.json"
      - "scripts/analyze_improvement_loop.py"
      - "scripts/check_branch_convergence.py"
      - "scripts/preflight_router.py"
      - "docs/repository-observatory/critic-router.md"
      - "docs/repository-observatory/branch-convergence.md"
      - "META_IMPROVEMENT_LOOP.md"
      - ".github/workflows/meta-improvement-loop.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 1"

permissions:
  contents: read

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Analyze improvement loop telemetry
        run: |
          python scripts/analyze_improvement_loop.py \
            --output /tmp/meta-loop.json
      - name: Validate Critic Router
        run: |
          python scripts/preflight_router.py \
            --path docs/assets/purrtocol/purrtocol.glb \
            --output /tmp/preflight-3d.json
          python scripts/preflight_router.py \
            --path scripts/http_429_survival.py \
            --output /tmp/preflight-429.json
          python scripts/preflight_router.py \
            --path data/meta_improvement_loop_policy.json \
            --output /tmp/preflight-meta.json
          python scripts/preflight_router.py \
            --path README.ja.md \
            --output /tmp/preflight-unmatched.json
          python - <<'PY'
          import json

          def load(path):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)

          d3 = load("/tmp/preflight-3d.json")
          h429 = load("/tmp/preflight-429.json")
          meta = load("/tmp/preflight-meta.json")
          unmatched = load("/tmp/preflight-unmatched.json")

          assert "purrtocol-3d" in {
              r["route_id"] for r in d3["matched_routes"]
          }
          assert "http-429-survival" in {
              r["route_id"] for r in h429["matched_routes"]
          }
          assert "meta-improvement-loop" in {
              r["route_id"] for r in meta["matched_routes"]
          }
          assert unmatched["unmatched_paths"] == ["README.ja.md"]

          for result in (d3, h429, meta, unmatched):
              assert "Repository Observatory" in result["promotion_gates"]
              assert any(
                  "audit_repository_state.py" in command
                  for command in result["commands"]
              )
              assert (
                  result["interpretation"]["preflight_pass_does_not_mean"]
                  == "promotion gate passed"
              )

          print("Critic Router invariants: PASS")
          PY

      - name: Observe branch convergence risk
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          python scripts/check_branch_convergence.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output /tmp/branch-convergence.json
          python - <<'PY'
          import json

          with open("/tmp/branch-convergence.json", "r", encoding="utf-8") as f:
              r = json.load(f)

          assert r["schema"] == "branch-convergence-report/v1"
          assert r["classification"] == "early_integration_risk_diagnostic_not_conflict_proof"
          assert r["status"] in {
              "BASE_NOT_AHEAD",
              "BASE_AHEAD_NO_PATH_OVERLAP",
              "CONVERGENCE_RISK",
          }
          print(
              "Branch convergence observation:",
              r["status"],
              "overlap_count=",
              r["overlap_count"],
          )
          PY

      - name: Regress branch convergence against real stale PR history
        run: |
          BASE_CHECKPOINT="7547b817fd8271a3d54c2497ae1d311fd9f4056f"
          PR14_HEAD="513e06463b44748c28da301b73f279d205e65294"
          PR10_HEAD="efd907105b016e1f64042667276204efed20bb37"

          git fetch --no-tags origin "$BASE_CHECKPOINT" "$PR14_HEAD" "$PR10_HEAD"

          python scripts/check_branch_convergence.py \
            --base "$BASE_CHECKPOINT" \
            --head "$PR14_HEAD" \
            --output /tmp/branch-convergence-pr14.json

          python scripts/check_branch_convergence.py \
            --base "$BASE_CHECKPOINT" \
            --head "$PR10_HEAD" \
            --output /tmp/branch-convergence-pr10.json

          python - <<'PY'
          import json

          def load(path):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)

          pr14 = load("/tmp/branch-convergence-pr14.json")
          pr10 = load("/tmp/branch-convergence-pr10.json")

          assert pr14["status"] == "CONVERGENCE_RISK"
          assert {
              "data/improvement_events.jsonl",
              "docs/repository-observatory/state.json",
          }.issubset(set(pr14["overlapping_changed_paths"]))

          assert pr10["status"] == "BASE_AHEAD_NO_PATH_OVERLAP"
          assert pr10["overlap_count"] == 0

          print(
              "Historical convergence regression: PASS",
              "PR14=", pr14["status"],
              "PR10=", pr10["status"],
          )
          PY

      - name: Check second-order guardrails
        run: |
          python - <<'PY'
          import json

          with open("/tmp/meta-loop.json", "r", encoding="utf-8") as f:
              r = json.load(f)

          assert r["schema"] == "meta-improvement-loop-report/v1"
          assert r["classification"] == "repository_process_telemetry_not_quality_score"
          assert r["aggregate"]["completed_cycles"] >= 4
          assert r["aggregate"]["verified_before_promotion_ratio"] == 1.0
          assert r["interpretation"]["single_overall_score"] == "FORBIDDEN"
          evaluation = r["first_tuning_evaluation"]
          assert evaluation["tuning_id"] == "critic-router-v1"
          assert evaluation["post_tuning"]["sample_count"] >= 3
          assert evaluation["status"] in {"PASS", "FAIL_GUARDRAIL"}
          assert not r["violations"]
          assert all(
              cycle["verified_before_promotion"]
              for cycle in r["cycles"]
          )

          # Observe before freezing any particular bottleneck.
          print("meta improvement structural invariants: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: meta-improvement-loop-report
          path: |
            /tmp/meta-loop.json
            /tmp/branch-convergence.json
            /tmp/branch-convergence-pr14.json
            /tmp/branch-convergence-pr10.json
