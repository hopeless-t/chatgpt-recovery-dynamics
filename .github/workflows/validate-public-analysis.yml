name: Validate public analysis

on:
  push:
  pull_request:
    paths-ignore:
      - "docs/429-conformance-lab/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Recompute public analysis
        run: python scripts/analyze_public_data.py > /tmp/public-analysis.json

      - name: Check published invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/public-analysis.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          assert s["pairing"]["total"] == 108
          assert s["pairing"]["accessible"] == 48
          assert s["pairing"]["blocked"] == 60
          assert s["pairing"]["mixed"] == 0

          assert s["sessionization"]["excluded_cross_epoch_transition_count"] == 1
          assert s["transition_counts_active_epochs_only"] == {
              "accessible->accessible": 38,
              "accessible->blocked": 10,
              "blocked->accessible": 8,
              "blocked->blocked": 50,
          }

          pbb = s["transition_probabilities"]["p_blocked_next_given_blocked"]
          assert abs(pbb - 0.8620689655172413) < 1e-12

          reg = s["cycle_time"]["service_time_regression"]
          assert abs(reg["intercept_s"] - 5.616397589315325) < 1e-9
          assert abs(reg["service_time_coefficient"] - 0.9565569848514345) < 1e-9
          assert abs(reg["r2"] - 0.9913563468164521) < 1e-12

          episodes = s["resume_observations"]["resume_404_episodes"]
          assert episodes[0]["successful_snapshot_payload_mib_from_public_rounded_data"] == 146.375
          assert episodes[1]["successful_snapshot_payload_mib_from_public_rounded_data"] == 36.594

          print("public analysis invariants: PASS")
          PY

  monte-carlo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run robust Monte Carlo reference
        run: |
          python scripts/monte_carlo_recovery.py             --trials 5000             --bootstrap-trials 10000             --output /tmp/monte-carlo.json

      - name: Check qualitative robustness invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/monte-carlo.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          base = s["policies"]["baseline"]
          anchor = s["policies"]["anchor_10s"]
          strong = s["policies"]["strong_backoff"]

          assert (
              anchor["pressure_feedback"]["recovery_rate"]
              > base["pressure_feedback"]["recovery_rate"]
          )

          assert (
              strong["pressure_feedback"]["recovery_rate"]
              > anchor["pressure_feedback"]["recovery_rate"]
          )
          assert (
              strong["attempt_driven"]["recovery_rate"]
              < anchor["attempt_driven"]["recovery_rate"]
          )

          ci = s["bootstrap"]["accessible_gap_median_s"]
          assert 9.5 < ci["p2_5"] < 10.5
          assert 10.0 < ci["p50"] < 10.6
          assert 10.5 < ci["p97_5"] < 11.5

          print("Monte Carlo qualitative invariants: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-reference
          path: /tmp/monte-carlo.json


  external-archaeology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Recompute external evidence archaeology
        run: python scripts/analyze_external_evidence.py --output /tmp/external-summary.json

      - name: Check archaeological invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/external-summary.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          assert s["archive_total"] == 15
          assert s["default_inference_subset"] == 13
          assert s["negative_controls"] == 1
          assert s["possible_local_overlap_excluded"] == 1
          assert s["archaeology_span_days"] == 1301

          core = s["core_2026"]
          assert core["reports"] == 12
          assert core["distinct_dates"] == 12
          assert core["span_days"] == 185

          co = s["cooccurrence_default_subset"]
          assert co["unable_load_and_too_many_requests"] == 4
          assert co["too_many_requests_and_local_trigger_association"] == 5
          assert co["state_dissociation_signature"] == 7
          assert co["transport_recovery_signature"] == 2

          clean = s["incident_unconfounded_sensitivity_subset"]
          assert clean["n"] == 10
          assert clean["unable_load_and_too_many_requests"] == 3
          assert clean["too_many_requests_and_local_trigger_association"] == 4
          assert clean["state_dissociation_signature"] == 6
          assert clean["transport_recovery_signature"] == 1

          print("external archaeology invariants: PASS")
          PY


  transition-biopsy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run A-to-B transition biopsy
        run: |
          python scripts/analyze_transition_biopsy.py \
            --output /tmp/transition-biopsy.json \
            --biopsy-output /tmp/transition-biopsy.jsonl

      - name: Run transition model competition
        run: |
          python scripts/compete_transition_models.py \
            --output /tmp/transition-models.json

      - name: Audit recovery-convergence identifiability
        run: |
          python scripts/audit_recovery_convergence_identifiability.py \
            --output /tmp/recovery-convergence-identifiability.json

      - name: Check transition invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/transition-biopsy.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          assert s["accessible_origin_transitions"] == 48
          assert s["a_to_b"] == 10
          assert s["a_to_a"] == 38

          c = s["reentry_contingency"]
          assert c["reentry_n"] == 8
          assert c["reentry_to_blocked"] == 8
          assert c["non_reentry_n"] == 40
          assert c["non_reentry_to_blocked"] == 2
          assert c["fisher_exact_one_sided"] < 1.3e-7

          mc = s["model_competition"]
          assert mc["delta_aic_history_minus_two_state"] < -30
          assert mc["delta_bic_history_minus_two_state"] < -28

          with open("/tmp/transition-models.json", "r", encoding="utf-8") as f:
              m = json.load(f)

          assert m["models"][0]["name"] == "M2_reentry_history"
          assert m["models"][0]["loo_logloss"] < 0.21
          assert m["models"][0]["log_bayes_factor_vs_constant"] > 15

          with open(
              "/tmp/recovery-convergence-identifiability.json",
              "r",
              encoding="utf-8",
          ) as f:
              fp = json.load(f)

          assert fp["schema"] == "recovery-convergence-identifiability/v1"
          assert fp["experiment_id"] == "REC-FP-001"
          assert fp["reentry"]["b_to_e_events"] == 8
          assert fp["reentry"]["e_to_b_next"] == 8
          assert fp["reentry"]["e_to_h_observed"] == 0
          assert fp["reentry"]["max_post_reentry_accessible_run_length"] == 1
          assert (
              fp["contraction_identifiability"][
                  "adjacent_post_reentry_accessible_pairs"
              ]
              == 0
          )
          assert (
              fp["contraction_identifiability"]["status"]
              == "CONTRACTION_NOT_IDENTIFIABLE_FROM_CURRENT_CAPTURE"
          )
          assert (
              fp["candidate_model_status"]["M_D_rebound_hysteresis"]
              == "SUPPORTED_WITHIN_CAPTURE"
          )
          assert (
              fp["candidate_model_status"]["M_C_observable_contraction"]
              == "UNIDENTIFIABLE_FROM_CURRENT_CAPTURE"
          )
          assert fp["candidate_model_status"]["M_E_no_fixed_point_structure"] == "NOT_REJECTED"

          with open("data/recovery_convergence_reference.json", "r", encoding="utf-8") as f:
              ref = json.load(f)

          assert ref["schema"] == "recovery-convergence-reference/v1"
          assert ref["experiment_id"] == "REC-FP-001"
          observed = ref["observed"]
          assert observed["b_to_e_events"] == fp["reentry"]["b_to_e_events"]
          assert observed["e_to_b_next"] == fp["reentry"]["e_to_b_next"]
          assert observed["e_to_h_observed"] == fp["reentry"]["e_to_h_observed"]
          assert (
              observed["post_reentry_run_lengths"]
              == fp["reentry"]["post_reentry_run_lengths"]
          )
          assert (
              observed["adjacent_post_reentry_accessible_pairs"]
              == fp["contraction_identifiability"][
                  "adjacent_post_reentry_accessible_pairs"
              ]
          )
          assert (
              observed["empirical_kappa_samples_available"]
              == fp["contraction_identifiability"][
                  "empirical_kappa_samples_available"
              ]
          )
          assert (
              observed["contraction_status"]
              == fp["contraction_identifiability"]["status"]
          )
          for key, value in observed["model_status"].items():
              assert fp["candidate_model_status"][key] == value

          print("A-to-B transition biopsy/model competition: PASS")
          print("REC-FP-001 identifiability audit: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: transition-biopsy-reference
          path: |
            /tmp/transition-biopsy.json
            /tmp/transition-biopsy.jsonl
            /tmp/transition-models.json
            /tmp/recovery-convergence-identifiability.json

  transport-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run transport/recovery path simulation
        run: |
          python scripts/simulate_transport_recovery_paths.py \
            --trials 5000 \
            --output /tmp/transport-recovery.json

      - name: Check transport robustness invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/transport-recovery.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          paths = s["paths"]
          baseline = paths["completion_per_context"]
          anchor = paths["anchored_singleflight_full"]
          observe = paths["observe_then_snapshot"]

          assert s["naive_first_success"]["posterior_predictive_false_rebound_rate"] > 0.85

          assert (
              anchor["request_count_pressure"]["recovery_rate"]
              > baseline["request_count_pressure"]["recovery_rate"]
          )
          assert (
              observe["request_count_pressure"]["recovery_rate"]
              == anchor["request_count_pressure"]["recovery_rate"]
          )
          assert (
              observe["request_count_pressure"]["payload_mib"]["mean"]
              < anchor["request_count_pressure"]["payload_mib"]["mean"] * 0.5
          )

          assert (
              observe["byte_weighted_pressure"]["recovery_rate"]
              > anchor["byte_weighted_pressure"]["recovery_rate"]
          )

          churn = s["optional_http3_path_churn_sensitivity"]
          assert churn["mean_h3_over_h2_delay_ratio"] < 0.6

          print("transport/recovery robustness invariants: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: transport-recovery-reference
          path: /tmp/transport-recovery.json


  server-congestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run popular-server congestion stress test
        run: |
          python scripts/simulate_server_congestion.py \
            --trials 12 \
            --output /tmp/server-congestion.json

      - name: Check server-friendly invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/server-congestion.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          p = s["policies"]
          naive = p["naive_completion"]
          retry = p["retry_after_jitter"]
          observe = p["singleflight_observe"]
          friendly = p["server_friendly_stack"]
          foreground = p["foreground_first"]

          assert (
              friendly["operational_knee_first_sampled_rho"]
              >= naive["operational_knee_first_sampled_rho"]
          )

          r90_naive = naive["by_rho"]["0.90"]
          r90_friendly = friendly["by_rho"]["0.90"]

          assert (
              r90_friendly["retry_amplification_per_logical_recovery"]["mean"]
              < r90_naive["retry_amplification_per_logical_recovery"]["mean"] * 0.35
          )
          assert (
              r90_friendly["recovery_payload_mib"]["mean"]
              < r90_naive["recovery_payload_mib"]["mean"] * 0.55
          )

          r100_naive = naive["by_rho"]["1.00"]
          r100_friendly = friendly["by_rho"]["1.00"]

          assert (
              r100_friendly["recovery_rate"]["mean"]
              > r100_naive["recovery_rate"]["mean"]
          )

          assert (
              retry["by_rho"]["0.98"]["retry_amplification_per_logical_recovery"]["mean"]
              < naive["by_rho"]["0.98"]["retry_amplification_per_logical_recovery"]["mean"]
          )

          assert (
              observe["by_rho"]["0.98"]["retry_amplification_per_logical_recovery"]["mean"]
              < retry["by_rho"]["0.98"]["retry_amplification_per_logical_recovery"]["mean"]
          )

          assert (
              foreground["by_rho"]["1.05"]["recovery_rate"]["mean"]
              <= friendly["by_rho"]["1.05"]["recovery_rate"]["mean"]
          )

          print("server congestion invariants: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: server-congestion-reference
          path: /tmp/server-congestion.json


  deep-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run deep trace validation
        run: |
          python scripts/deep_validate_trace.py \
            --permutations 5000 \
            --output /tmp/deep-validation.json

      - name: Run model generalization checks
        run: |
          python scripts/validate_model_generalization.py \
            --output /tmp/model-generalization.json

      - name: Check deep-validation invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/deep-validation.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          pair = s["pairing_window_sensitivity"]

          for ms in ("10", "20", "50", "100"):
              assert pair[ms]["total"] == 108
              assert pair[ms]["accessible"] == 48
              assert pair[ms]["blocked"] == 60
              assert pair[ms]["mixed"] == 0

          gaps = s["epoch_gap_sensitivity"]

          expected = {
              "A->A": 38,
              "A->B": 10,
              "B->A": 8,
              "B->B": 50,
          }

          for gap in ("20", "30", "45", "60", "90", "120", "300", "600"):
              for key, value in expected.items():
                  assert gaps[gap][key] == value

          timing = s["timing_model"]
          ar = timing["best_bic_model"]

          assert ar["order"] == 1
          assert 0.50 < ar["phi"][0] < 0.55
          assert ar["bic"] < timing["ar_residual_competition"][0]["bic"] - 25

          wait = timing["wait_dynamics"]
          assert 0.64 < wait["ar1_phi"] < 0.71

          cross = timing["cross_epoch_prediction"]
          assert cross["fit_epoch1_test_epoch2"]["test"]["rmse_s"] < 0.30
          assert cross["fit_epoch2_test_epoch1"]["test"]["rmse_s"] < 0.30

          cps = s["change_points"]
          assert len(cps) == 2

          for cp in cps:
              assert cp["change_point_matches_first_blocked"] is True
              assert cp["observed"]["sse_reduction_fraction"] > 0.55
              assert cp["p_max_reduction_ge_observed"] < 0.001

          pp = s["posterior_predictive_history_free_markov"]
          assert 2e-5 < pp["probability"] < 2.5e-5

          morph = s["epoch_morphology"]
          assert morph["epochs"][0]["length"] == 34
          assert morph["epochs"][1]["length"] == 34
          assert morph["epochs"][0]["a_count"] == 4
          assert morph["epochs"][1]["a_count"] == 4
          assert morph["exact_symbol_matches"] == 30
          assert 0.05 < morph["random_4_of_34_overlap_tail"] < 0.07

          replay = s["trace_preserving_replay"]
          assert abs(replay["actual_success_snapshot_mib"] - 36.59375) < 1e-12
          assert abs(replay["replay_payload_mib"] - 0.265625) < 1e-12
          assert replay["full_materializations"] == 0
          assert replay["payload_reduction_fraction"] > 0.992

          with open("/tmp/model-generalization.json", "r", encoding="utf-8") as f:
              g = json.load(f)

          controlled = g["timing_memory_after_controls"][1]
          assert 0.49 < controlled["ar1_phi"] < 0.54
          assert controlled["ar1_bic"] < controlled["base_bic"] - 25

          same = g["same_state_memory_from_base_residuals"]
          assert same["accessible"]["phi"] > 0.70
          assert same["blocked"]["phi"] > 0.60

          for fold in g["cross_epoch_transition_prediction"]:
              assert fold["HEB_logloss"] < fold["AB_logloss"]

          print("deep trace validation: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: deep-validation-reference
          path: |
            /tmp/deep-validation.json
            /tmp/model-generalization.json


  recovery-helper-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate bilingual privacy-preserving Recovery Helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("docs/recovery-helper/index.html")
          html = path.read_text(encoding="utf-8")

          assert "<!doctype html>" in html.lower()
          assert 'id="langJa"' in html
          assert 'id="langEn"' in html
          assert "日本語" in html
          assert "English" in html
          assert "ChatGPT Recovery Helper" in html

          forbidden = [
              r"\bfetch\s*\(",
              r"XMLHttpRequest",
              r"new\s+WebSocket",
              r"EventSource",
              r"sendBeacon",
              r"(?:window\.)?localStorage\s*(?:\.|\[|=)",
              r"(?:window\.)?sessionStorage\s*(?:\.|\[|=)",
              r"document\.cookie",
              r"<script[^>]+src=",
              r"<img\b",
              r"<iframe\b",
              r"<form\b",
          ]

          for pattern in forbidden:
              assert re.search(pattern, html, re.I) is None, pattern

          assert "connect-src 'none'" in html
          assert "img-src 'none'" in html
          assert "font-src 'none'" in html
          assert "form-action 'none'" in html
          assert 'rel="noopener noreferrer"' in html

          urls = re.findall(r"https?://[^\s\"'<>]+", html)
          allowed = (
              "https://status.openai.com/",
              "https://help.openai.com/",
          )
          for url in urls:
              assert url.startswith(allowed), url

          assert "OpenAI公式" in html
          assert "OpenAI official" in html
          assert "この研究からの提案" in html
          assert "Research-derived" in html

          print("Recovery Helper safety/bilingual invariants: PASS")
          PY



  repository-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate documentation/governance surface
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "FAQ.md",
              "GLOSSARY.md",
              "CHANGELOG.md",
              "BRANDING.md",
              "releases/RELEASE-NOTES-v0.1.0.md",
              "docs/mascot.md",
              "docs/assets/purrtocol.svg",
              "docs/cm/index.html",
              "docs/adrs/ADR-0001-evidence-boundary.md",
              "docs/adrs/ADR-0002-recovery-hysteresis.md",
              "docs/adrs/ADR-0003-provider-friendly-recovery.md",
              "rfcs/RFC-0001-recovery-survival-plane.md",
              "rfcs/RFC-0002-popular-server-congestion.md",
              "docs/paper/PAPER.md",
              "docs/paper/README.md",
              "wiki-src/Purrtocol.md",
              "wiki-src/Paper.md",
              "wiki-src/Architecture-Decisions.md",
              "wiki-src/RFCs.md",
          ]

          missing = [p for p in required if not Path(p).exists()]
          assert not missing, missing

          readme = Path("README.md").read_text(encoding="utf-8")
          for phrase in [
              "Recover. Don't amplify.",
              "Visualization ≠ Evidence.",
              "Purrtocol",
              "Retry less. Observe more.",
          ]:
              assert phrase in readme, phrase

          svg = Path("docs/assets/purrtocol.svg").read_text(encoding="utf-8")
          assert "<svg" in svg and "PURRTOCOL" in svg

          cm = Path("docs/cm/index.html").read_text(encoding="utf-8")
          assert "パケニャの会話復旧相談室" in cm
          assert "あわてず・ふやさず・パケニャ" in cm
          assert "Visualization ≠ Evidence" in cm

          print("repository surface invariants: PASS")
          PY


