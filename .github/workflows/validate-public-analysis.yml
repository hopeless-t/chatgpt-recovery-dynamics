        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open("/tmp/pakenya-expansion.json",encoding="utf-8"))
          ref=json.load(open("data/pakenya_expansion_reference.json",encoding="utf-8"))
