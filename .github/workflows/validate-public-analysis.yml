name: Validate public analysis

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Recompute public analysis
        run: python scripts/analyze_public_data.py > /tmp/public-analysis.json

      - name: Check published invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/public-analysis.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          assert s["pairing"]["total"] == 108
          assert s["pairing"]["accessible"] == 48
          assert s["pairing"]["blocked"] == 60
          assert s["pairing"]["mixed"] == 0

          assert s["sessionization"]["excluded_cross_epoch_transition_count"] == 1
          assert s["transition_counts_active_epochs_only"] == {
              "accessible->accessible": 38,
              "accessible->blocked": 10,
              "blocked->accessible": 8,
              "blocked->blocked": 50,
          }

          pbb = s["transition_probabilities"]["p_blocked_next_given_blocked"]
          assert abs(pbb - 0.8620689655172413) < 1e-12

          reg = s["cycle_time"]["service_time_regression"]
          assert abs(reg["intercept_s"] - 5.616397589315325) < 1e-9
          assert abs(reg["service_time_coefficient"] - 0.9565569848514345) < 1e-9
          assert abs(reg["r2"] - 0.9913563468164521) < 1e-12

          episodes = s["resume_observations"]["resume_404_episodes"]
          assert episodes[0]["successful_snapshot_payload_mib_from_public_rounded_data"] == 146.375
          assert episodes[1]["successful_snapshot_payload_mib_from_public_rounded_data"] == 36.594

          print("public analysis invariants: PASS")
          PY

  monte-carlo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run robust Monte Carlo reference
        run: |
          python scripts/monte_carlo_recovery.py             --trials 5000             --bootstrap-trials 10000             --output /tmp/monte-carlo.json

      - name: Check qualitative robustness invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/monte-carlo.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          base = s["policies"]["baseline"]
          anchor = s["policies"]["anchor_10s"]
          strong = s["policies"]["strong_backoff"]

          # Start anchoring should reduce pressure-feedback failures in this
          # deliberately broad stress model.
          assert (
              anchor["pressure_feedback"]["recovery_rate"]
              > base["pressure_feedback"]["recovery_rate"]
          )

          # Strong backoff should show the intended model-risk tradeoff:
          # it helps under pressure feedback but can hurt when recovery is
          # attempt-driven.
          assert (
              strong["pressure_feedback"]["recovery_rate"]
              > anchor["pressure_feedback"]["recovery_rate"]
          )
          assert (
              strong["attempt_driven"]["recovery_rate"]
              < anchor["attempt_driven"]["recovery_rate"]
          )

          ci = s["bootstrap"]["accessible_gap_median_s"]
          assert 9.5 < ci["p2_5"] < 10.5
          assert 10.0 < ci["p50"] < 10.6
          assert 10.5 < ci["p97_5"] < 11.5

          print("Monte Carlo qualitative invariants: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-reference
          path: /tmp/monte-carlo.json


  external-archaeology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Recompute external evidence archaeology
        run: python scripts/analyze_external_evidence.py --output /tmp/external-summary.json

      - name: Check archaeological invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/external-summary.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          assert s["archive_total"] == 15
          assert s["default_inference_subset"] == 13
          assert s["negative_controls"] == 1
          assert s["possible_local_overlap_excluded"] == 1
          assert s["archaeology_span_days"] == 1301

          core = s["core_2026"]
          assert core["reports"] == 12
          assert core["distinct_dates"] == 12
          assert core["span_days"] == 185

          co = s["cooccurrence_default_subset"]
          assert co["unable_load_and_too_many_requests"] == 4
          assert co["too_many_requests_and_local_trigger_association"] == 5
          assert co["state_dissociation_signature"] == 7
          assert co["transport_recovery_signature"] == 2

          clean = s["incident_unconfounded_sensitivity_subset"]
          assert clean["n"] == 10
          assert clean["unable_load_and_too_many_requests"] == 3
          assert clean["too_many_requests_and_local_trigger_association"] == 4
          assert clean["state_dissociation_signature"] == 6
          assert clean["transport_recovery_signature"] == 1

          print("external archaeology invariants: PASS")
          PY


  transition-biopsy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run A-to-B transition biopsy
        run: |
          python scripts/analyze_transition_biopsy.py \
            --output /tmp/transition-biopsy.json \
            --biopsy-output /tmp/transition-biopsy.jsonl

      - name: Run transition model competition
        run: |
          python scripts/compete_transition_models.py \
            --output /tmp/transition-models.json

      - name: Check transition invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/transition-biopsy.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          assert s["accessible_origin_transitions"] == 48
          assert s["a_to_b"] == 10
          assert s["a_to_a"] == 38

          c = s["reentry_contingency"]
          assert c["reentry_n"] == 8
          assert c["reentry_to_blocked"] == 8
          assert c["non_reentry_n"] == 40
          assert c["non_reentry_to_blocked"] == 2
          assert c["fisher_exact_one_sided"] < 1.3e-7

          mc = s["model_competition"]
          assert mc["delta_aic_history_minus_two_state"] < -30
          assert mc["delta_bic_history_minus_two_state"] < -28

          with open("/tmp/transition-models.json", "r", encoding="utf-8") as f:
              m = json.load(f)

          assert m["models"][0]["name"] == "M2_reentry_history"
          assert m["models"][0]["loo_logloss"] < 0.21
          assert m["models"][0]["log_bayes_factor_vs_constant"] > 15

          print("A-to-B transition biopsy/model competition: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: transition-biopsy-reference
          path: |
            /tmp/transition-biopsy.json
            /tmp/transition-biopsy.jsonl
            /tmp/transition-models.json

  transport-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run transport/recovery path simulation
        run: |
          python scripts/simulate_transport_recovery_paths.py \
            --trials 5000 \
            --output /tmp/transport-recovery.json

      - name: Check transport robustness invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/transport-recovery.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          paths = s["paths"]
          baseline = paths["completion_per_context"]
          anchor = paths["anchored_singleflight_full"]
          observe = paths["observe_then_snapshot"]

          assert s["naive_first_success"]["posterior_predictive_false_rebound_rate"] > 0.85

          assert (
              anchor["request_count_pressure"]["recovery_rate"]
              > baseline["request_count_pressure"]["recovery_rate"]
          )
          assert (
              observe["request_count_pressure"]["recovery_rate"]
              == anchor["request_count_pressure"]["recovery_rate"]
          )
          assert (
              observe["request_count_pressure"]["payload_mib"]["mean"]
              < anchor["request_count_pressure"]["payload_mib"]["mean"] * 0.5
          )

          assert (
              observe["byte_weighted_pressure"]["recovery_rate"]
              > anchor["byte_weighted_pressure"]["recovery_rate"]
          )

          churn = s["optional_http3_path_churn_sensitivity"]
          assert churn["mean_h3_over_h2_delay_ratio"] < 0.6

          print("transport/recovery robustness invariants: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: transport-recovery-reference
          path: /tmp/transport-recovery.json


  server-congestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run popular-server congestion stress test
        run: |
          python scripts/simulate_server_congestion.py \
            --trials 12 \
            --output /tmp/server-congestion.json

      - name: Check server-friendly invariants
        run: |
          python - <<'PY'
          import json

          with open("/tmp/server-congestion.json", "r", encoding="utf-8") as f:
              s = json.load(f)

          p = s["policies"]
          naive = p["naive_completion"]
          retry = p["retry_after_jitter"]
          observe = p["singleflight_observe"]
          friendly = p["server_friendly_stack"]
          foreground = p["foreground_first"]

          # The observed-design stack should push the sampled pressure knee
          # later than naive completion-coupled retries.
          assert (
              friendly["operational_knee_first_sampled_rho"]
              >= naive["operational_knee_first_sampled_rho"]
          )

          r90_naive = naive["by_rho"]["0.90"]
          r90_friendly = friendly["by_rho"]["0.90"]

          assert (
              r90_friendly["retry_amplification_per_logical_recovery"]["mean"]
              < r90_naive["retry_amplification_per_logical_recovery"]["mean"] * 0.35
          )
          assert (
              r90_friendly["recovery_payload_mib"]["mean"]
              < r90_naive["recovery_payload_mib"]["mean"] * 0.55
          )

          r100_naive = naive["by_rho"]["1.00"]
          r100_friendly = friendly["by_rho"]["1.00"]

          assert (
              r100_friendly["recovery_rate"]["mean"]
              > r100_naive["recovery_rate"]["mean"]
          )

          # Retry-After/jitter alone should reduce retry amplification.
          assert (
              retry["by_rho"]["0.98"]["retry_amplification_per_logical_recovery"]["mean"]
              < naive["by_rho"]["0.98"]["retry_amplification_per_logical_recovery"]["mean"]
          )

          # Single-flight/observe should reduce it further.
          assert (
              observe["by_rho"]["0.98"]["retry_amplification_per_logical_recovery"]["mean"]
              < retry["by_rho"]["0.98"]["retry_amplification_per_logical_recovery"]["mean"]
          )

          # Emergency foreground-first mode is allowed to defer recovery in
          # genuine overload; it must not pretend to create capacity.
          assert (
              foreground["by_rho"]["1.05"]["recovery_rate"]["mean"]
              <= friendly["by_rho"]["1.05"]["recovery_rate"]["mean"]
          )

          print("server congestion invariants: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: server-congestion-reference
          path: /tmp/server-congestion.json
