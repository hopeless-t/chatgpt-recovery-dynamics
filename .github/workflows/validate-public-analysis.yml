          assert s["checkpoint"]["commit"]=="ec25244a024f2049cfc7851c7fafd421d35a113c"
          assert s["event_log"]["events_total"]==36
          assert s["event_log"]["primary_fit_events"]==10
          assert s["event_log"]["measurement_associated_events"]==12
          assert s["event_log"]["checkpoint_events"]==22
          assert s["event_log"]["post_checkpoint_events"]==14
          assert s["event_log"]["pairwise_contact_surface"]==630
          assert s["event_log"]["checkpoint_pairwise_contact_surface"]==231
