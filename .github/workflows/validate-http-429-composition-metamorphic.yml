name: Validate 429 Composition Metamorphic Swarm

on:
  push:
    paths:
      - "scripts/http_429_recovery_composition_swarm.py"
      - "scripts/http_429_recovery_composition.py"
      - "scripts/http_429_recovery_hysteresis.py"
      - "scripts/http_429_survival.py"
      - "data/http_429_recovery_composition_contract.json"
      - "data/http_429_recovery_composition_metamorphic_reference.json"
      - "data/preflight_routes.json"
      - "docs/429-conformance-lab/composition-metamorphic.md"
      - ".github/workflows/validate-http-429-composition-metamorphic.yml"
  pull_request:
    paths:
      - "scripts/http_429_recovery_composition_swarm.py"
      - "scripts/http_429_recovery_composition.py"
      - "scripts/http_429_recovery_hysteresis.py"
      - "scripts/http_429_survival.py"
      - "data/http_429_recovery_composition_contract.json"
      - "data/http_429_recovery_composition_metamorphic_reference.json"
      - "data/preflight_routes.json"
      - "docs/429-conformance-lab/composition-metamorphic.md"
      - ".github/workflows/validate-http-429-composition-metamorphic.yml"

permissions:
  contents: read

jobs:
  relations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run scheduler-confidence Metamorphic Kitten Swarm
        run: |
          python scripts/http_429_recovery_composition_swarm.py \
            --output /tmp/http-429-recovery-composition-swarm.json

      - name: Check predeclared relation surface
        run: |
          python - <<'PY'
          import json

          r = json.load(open(
              "/tmp/http-429-recovery-composition-swarm.json",
              encoding="utf-8",
          ))

          assert r["schema"] == "http-429-recovery-composition-metamorphic-report/v1"
          assert r["experiment_id"] == "NET-429-COMP-002"
          assert r["classification"] == (
              "deterministic_composition_metamorphic_lab_not_provider_behavior"
          )
          assert r["generator"]["id"] == (
              "scheduler-confidence-metamorphic-kitten-swarm-v1"
          )
          assert r["generator"]["deterministic"] is True
          assert r["generator"]["policy_count"] == 36
          assert r["generator"]["confirmation_counts"] == [2, 3, 4]
          assert r["generator"]["minimum_recovering_durations_s"] == [0.0, 5.0]
          assert r["generator"]["base_minimum_periods_s"] == [0.5, 1.0]
          assert r["generator"]["recovery_probe_periods_s"] == [1.0, 5.0, 10.0]
          assert r["generator"]["relation_checks"] == 360
          assert set(r["generator"]["relation_families"].values()) == {36}
          assert set(r["generator"]["relation_families"]) == {
              "blocked_confidence_never_retries_earlier",
              "recovering_confidence_never_retries_earlier",
              "strong_retry_after_remains_authoritative",
              "confidence_never_overrides_budget_stop",
              "confidence_never_overrides_reobserve",
              "time_translation_preserves_composition_semantics",
              "stronger_probe_floor_cannot_retry_earlier",
              "stronger_base_floor_cannot_retry_earlier",
              "pacing_relaxes_only_at_healthy_threshold",
              "stricter_confidence_cannot_relax_pacing_earlier",
          }
          assert r["summary"] == {
              "relation_checks": 360,
              "passed": 360,
              "failed": 0,
          }
          assert r["authority_boundary"] == {
              "scheduler_owns_retry_authorization": True,
              "hysteresis_owns_recovery_confidence": True,
              "confidence_can_create_replay_authority": False,
              "confidence_can_shorten_scheduler_floor": False,
          }
          assert r["safety"] == {
              "network_access": False,
              "production_traffic": False,
              "operation_replay_authority": False,
          }

          print("HTTP 429 Scheduler x Confidence Metamorphic Kitten Swarm: PASS (360/360)")
          PY

      - name: Compare frozen first observation
        run: |
          python - <<'PY'
          import json

          observed = json.load(open(
              "/tmp/http-429-recovery-composition-swarm.json",
              encoding="utf-8",
          ))
          reference = json.load(open(
              "data/http_429_recovery_composition_metamorphic_reference.json",
              encoding="utf-8",
          ))
          frozen = reference["observed"]

          assert reference["schema"] == (
              "http-429-recovery-composition-metamorphic-reference/v1"
          )
          assert reference["experiment_id"] == "NET-429-COMP-002"
          assert observed["generator"]["id"] == frozen["generator_id"]
          assert observed["generator"]["generated_input_sha256"] == (
              frozen["generated_input_sha256"]
          )
          assert observed["generator"]["policy_count"] == frozen["policy_count"]
          assert observed["generator"]["relation_checks"] == frozen["relation_checks"]
          assert observed["generator"]["relation_families"] == (
              frozen["relation_families"]
          )
          assert observed["summary"]["passed"] == frozen["passed"]
          assert observed["summary"]["failed"] == frozen["failed"]
          assert observed["authority_boundary"] == frozen["authority_boundary"]
          assert observed["safety"] == frozen["safety"]

          print("NET-429-COMP-002 frozen first observation: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: http-429-composition-metamorphic
          path: /tmp/http-429-recovery-composition-swarm.json
