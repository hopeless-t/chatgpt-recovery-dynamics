name: Validate Purrtocol Connection Amplification

on:
  pull_request:
    paths:
      - 'scripts/purrtocol_connection_amplification.py'
      - 'scripts/purrtocol_recovery_policy_lab.py'
      - 'scripts/purrtocol_recovery_safety_frontier.py'
      - 'docs/purrtocol-connection-amplification.md'
      - 'docs/purrtocol-recovery-policy-lab.md'
      - 'docs/purrtocol-recovery-safety-frontier.md'
      - '.github/workflows/validate-purrtocol-connection-amplification.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/purrtocol_connection_amplification.py'
      - 'scripts/purrtocol_recovery_policy_lab.py'
      - 'scripts/purrtocol_recovery_safety_frontier.py'
      - 'docs/purrtocol-connection-amplification.md'
      - 'docs/purrtocol-recovery-policy-lab.md'
      - 'docs/purrtocol-recovery-safety-frontier.md'
      - '.github/workflows/validate-purrtocol-connection-amplification.yml'

jobs:
  bounded-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile bounded model, policy lab, and safety frontier
        run: |
          python -m py_compile \
            scripts/purrtocol_connection_amplification.py \
            scripts/purrtocol_recovery_policy_lab.py \
            scripts/purrtocol_recovery_safety_frontier.py

      - name: Build shared-capacity counterexample scenario
        run: |
          python - <<'PY'
          import json
          doc={
            'schema':'purrtocol-connection-amplification-input/v0',
            'scenario_id':'small-local-hero-vs-larger-global-safe',
            'baseline_request_rate_rps':40.0,
            'shared_connection_capacity':100.0,
            'max_retry_depth':4,
            'policies':[
              {
                'policy_id':'small-local-hero',
                'fanout_connections_per_attempt':4.0,
                'failure_probability':0.7,
                'retry_multiplier':1.5,
                'connection_hold_seconds':0.5,
                'payload_bytes':1000,
                'local_success_probability':0.99,
              },
              {
                'policy_id':'larger-global-safe',
                'fanout_connections_per_attempt':1.0,
                'failure_probability':0.2,
                'retry_multiplier':0.5,
                'connection_hold_seconds':0.25,
                'payload_bytes':4000,
                'local_success_probability':0.90,
              },
            ],
          }
          json.dump(doc,open('/tmp/scenario-depth4.json','w',encoding='utf-8'),sort_keys=True)
          shallow=dict(doc)
          shallow['scenario_id']='same-policies-no-retry-depth'
          shallow['max_retry_depth']=0
          json.dump(shallow,open('/tmp/scenario-depth0.json','w',encoding='utf-8'),sort_keys=True)
          PY

      - name: Run model twice and require deterministic output
        run: |
          python scripts/purrtocol_connection_amplification.py --input /tmp/scenario-depth4.json --output /tmp/model-a.json
          python scripts/purrtocol_connection_amplification.py --input /tmp/scenario-depth4.json --output /tmp/model-b.json
          cmp /tmp/model-a.json /tmp/model-b.json
          python scripts/purrtocol_connection_amplification.py --input /tmp/scenario-depth0.json --output /tmp/model-depth0.json

      - name: Prove local optimization can lose the global capacity gate
        run: |
          python - <<'PY'
          import json
          deep=json.load(open('/tmp/model-a.json',encoding='utf-8'))
          shallow=json.load(open('/tmp/model-depth0.json',encoding='utf-8'))
          assert deep['schema']=='purrtocol-connection-amplification/v0'
          assert deep['evidence_status']=='modeled_bounded_scenario'
          assert deep['model_contract']['finite_retry_depth_only'] is True
          assert deep['model_contract']['infinite_series_used'] is False
          assert deep['model_contract']['exact_provider_topology_claimed'] is False
          rows={r['policy_id']:r for r in deep['policies']}
          shallow_rows={r['policy_id']:r for r in shallow['policies']}
          hero=rows['small-local-hero']
          safe=rows['larger-global-safe']
          hero0=shallow_rows['small-local-hero']
          assert hero['payload_bytes'] < safe['payload_bytes']
          assert hero['local_success_probability'] > safe['local_success_probability']
          assert hero['retry_branch_factor'] == 1.05
          assert hero['retry_shape']=='NON_DECAYING_BOUNDED'
          assert safe['retry_shape']=='DECAYING_BOUNDED'
          assert hero0['expected_concurrent_connections'] == 80.0
          assert hero0['connection_capacity_gate']['status']=='WITHIN_CAPACITY'
          assert hero['expected_concurrent_connections'] > 400.0
          assert hero['connection_capacity_gate']['status']=='CAPACITY_EXCEEDED'
          assert safe['connection_capacity_gate']['status']=='WITHIN_CAPACITY'
          assert hero['expected_concurrent_connections'] > hero0['expected_concurrent_connections'] * 5
          print('Connection amplification global-safety counterexample: PASS')
          print('hero depth0 -> depth4:',hero0['expected_concurrent_connections'],'->',hero['expected_concurrent_connections'])
          print('safe depth4:',safe['expected_concurrent_connections'])
          PY

      - name: Prove bounded depth even in non-decaying regime
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/model-a.json',encoding='utf-8'))
          hero=next(r for r in d['policies'] if r['policy_id']=='small-local-hero')
          assert len(hero['retry_terms'])==d['scenario']['max_retry_depth']+1
          assert hero['retry_terms']==[1.0,1.05,1.1025,1.157625,1.21550625]
          assert hero['expected_attempt_multiplier']==5.52563125
          print('Finite non-decaying retry tree: PASS')
          PY

      - name: Build Recovery Policy Lab interventions
        run: |
          python - <<'PY'
          import json
          doc={
            'schema':'purrtocol-recovery-policy-lab-input/v0',
            'lab_id':'shared-capacity-mitigation-classes',
            'base_scenario':{
              'baseline_request_rate_rps':40.0,
              'shared_connection_capacity':100.0,
              'max_retry_depth':4,
            },
            'base_policy':{
              'policy_id':'small-local-hero',
              'fanout_connections_per_attempt':4.0,
              'failure_probability':0.7,
              'retry_multiplier':1.5,
              'connection_hold_seconds':0.5,
              'payload_bytes':1000,
              'local_success_probability':0.99,
            },
            'interventions':[
              {
                'intervention_id':'capacity-expansion',
                'mechanism':'effective-shared-capacity-increase-proxy',
                'scenario_overrides':{'shared_connection_capacity':500.0},
              },
              {
                'intervention_id':'fanout-cap-only',
                'mechanism':'connection-fanout-reduction',
                'policy_overrides':{'fanout_connections_per_attempt':1.0},
              },
              {
                'intervention_id':'reduce-failure-branch',
                'mechanism':'failure-probability-reduction-proxy',
                'policy_overrides':{'failure_probability':0.1},
              },
              {
                'intervention_id':'retry-depth-zero',
                'mechanism':'retry-budget-depth-cap',
                'scenario_overrides':{'max_retry_depth':0},
              },
              {
                'intervention_id':'shorten-hold-time',
                'mechanism':'connection-hold-time-reduction',
                'policy_overrides':{'connection_hold_seconds':0.1},
              },
              {
                'intervention_id':'stop-repeated-checks',
                'mechanism':'failure-triggered-repeat-suppression',
                'policy_overrides':{'retry_multiplier':0.0},
              },
            ],
          }
          json.dump(doc,open('/tmp/policy-lab-input.json','w',encoding='utf-8'),sort_keys=True)
          PY

      - name: Run Policy Lab twice and require deterministic classification
        run: |
          python scripts/purrtocol_recovery_policy_lab.py --input /tmp/policy-lab-input.json --output /tmp/policy-lab-a.json
          python scripts/purrtocol_recovery_policy_lab.py --input /tmp/policy-lab-input.json --output /tmp/policy-lab-b.json
          cmp /tmp/policy-lab-a.json /tmp/policy-lab-b.json

      - name: Prove substantial single mitigation can remain insufficient
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/policy-lab-a.json',encoding='utf-8'))
          assert d['schema']=='purrtocol-recovery-policy-lab/v0'
          assert d['evidence_status']=='modeled_bounded_policy_lab'
          assert d['selection_policy']=='classify-capacity-safety-no-hidden-policy-winner'
          assert d['baseline']['expected_concurrent_connections']==442.0505
          assert d['baseline']['capacity_gate']['status']=='CAPACITY_EXCEEDED'
          rows={r['intervention_id']:r for r in d['interventions']}
          assert rows['stop-repeated-checks']['expected_concurrent_connections']==80.0
          assert rows['stop-repeated-checks']['capacity_gate']['status']=='WITHIN_CAPACITY'
          assert rows['fanout-cap-only']['expected_concurrent_connections']==110.512625
          assert rows['fanout-cap-only']['capacity_gate']['status']=='CAPACITY_EXCEEDED'
          assert rows['reduce-failure-branch']['expected_concurrent_connections']==94.1105
          assert rows['reduce-failure-branch']['capacity_gate']['status']=='WITHIN_CAPACITY'
          assert rows['shorten-hold-time']['expected_concurrent_connections']==88.4101
          assert rows['shorten-hold-time']['capacity_gate']['status']=='WITHIN_CAPACITY'
          assert rows['retry-depth-zero']['expected_concurrent_connections']==80.0
          assert rows['retry-depth-zero']['capacity_gate']['status']=='WITHIN_CAPACITY'
          assert rows['capacity-expansion']['expected_concurrent_connections']==442.0505
          assert rows['capacity-expansion']['capacity_gate']['status']=='WITHIN_CAPACITY'
          assert d['unsafe_interventions']==['fanout-cap-only']
          assert d['safe_interventions']==[
              'capacity-expansion','reduce-failure-branch','retry-depth-zero',
              'shorten-hold-time','stop-repeated-checks'
          ]
          assert d['world_laws']['heterogeneous_intervention_costs_not_scalarized'] is True
          assert d['world_laws']['safe_set_is_not_final_winner'] is True
          print('Recovery Policy Lab safe-set classification: PASS')
          PY

      - name: Build Recovery Safety Frontier levers
        run: |
          python - <<'PY'
          import json
          doc={
            'schema':'purrtocol-recovery-safety-frontier-input/v0',
            'frontier_id':'complementary-shared-capacity-policies',
            'base_scenario':{
              'baseline_request_rate_rps':40.0,
              'shared_connection_capacity':100.0,
              'max_retry_depth':4,
            },
            'base_policy':{
              'policy_id':'small-local-hero',
              'fanout_connections_per_attempt':4.0,
              'failure_probability':0.7,
              'retry_multiplier':1.5,
              'connection_hold_seconds':0.5,
              'payload_bytes':1000,
              'local_success_probability':0.99,
            },
            'max_package_size':2,
            'levers':[
              {
                'lever_id':'fanout-cap',
                'mechanism':'connection-fanout-reduction',
                'policy_overrides':{'fanout_connections_per_attempt':1.0},
              },
              {
                'lever_id':'hold-time-cap',
                'mechanism':'connection-hold-time-reduction',
                'policy_overrides':{'connection_hold_seconds':0.4},
              },
              {
                'lever_id':'retry-depth-two',
                'mechanism':'retry-budget-depth-cap',
                'scenario_overrides':{'max_retry_depth':2},
              },
              {
                'lever_id':'retry-multiplier-cap',
                'mechanism':'failure-triggered-repeat-reduction',
                'policy_overrides':{'retry_multiplier':1.0},
              },
            ],
          }
          json.dump(doc,open('/tmp/safety-frontier-input.json','w',encoding='utf-8'),sort_keys=True)
          PY

      - name: Run Safety Frontier twice and require deterministic packages
        run: |
          python scripts/purrtocol_recovery_safety_frontier.py --input /tmp/safety-frontier-input.json --output /tmp/safety-frontier-a.json
          python scripts/purrtocol_recovery_safety_frontier.py --input /tmp/safety-frontier-input.json --output /tmp/safety-frontier-b.json
          cmp /tmp/safety-frontier-a.json /tmp/safety-frontier-b.json

      - name: Prove unsafe singletons can form an inclusion-minimal safe frontier
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/safety-frontier-a.json',encoding='utf-8'))
          assert d['schema']=='purrtocol-recovery-safety-frontier/v0'
          assert d['evidence_status']=='modeled_bounded_safety_frontier'
          assert d['selection_policy']=='inclusion-minimal-capacity-safe-packages-no-cost-scalarization'
          assert d['baseline']['expected_concurrent_connections']==442.0505
          rows={r['package_id']:r for r in d['packages']}

          for singleton in ['fanout-cap','hold-time-cap','retry-depth-two','retry-multiplier-cap']:
              assert rows[singleton]['capacity_gate']['status']=='CAPACITY_EXCEEDED'

          assert rows['fanout-cap']['expected_concurrent_connections']==110.512625
          assert rows['retry-multiplier-cap']['expected_concurrent_connections']==221.848
          assert rows['fanout-cap+retry-multiplier-cap']['expected_concurrent_connections']==55.462
          assert rows['fanout-cap+hold-time-cap']['expected_concurrent_connections']==88.4101
          assert rows['fanout-cap+retry-depth-two']['expected_concurrent_connections']==63.05

          assert d['minimal_safe_packages']==[
              'fanout-cap+hold-time-cap',
              'fanout-cap+retry-depth-two',
              'fanout-cap+retry-multiplier-cap',
          ]
          assert d['complementarity_packages']==d['minimal_safe_packages']
          assert d['world_laws']['inclusion_minimal_does_not_mean_cheapest'] is True
          assert d['world_laws']['heterogeneous_intervention_costs_not_scalarized'] is True
          assert d['world_laws']['unsafe_singletons_can_form_safe_packages'] is True
          print('Recovery Safety Frontier complementarity: PASS')
          PY

      - name: Upload modeled scenario, policy, and frontier ledgers
        uses: actions/upload-artifact@v4
        with:
          name: purrtocol-connection-amplification-v0
          path: |
            /tmp/scenario-depth4.json
            /tmp/scenario-depth0.json
            /tmp/model-a.json
            /tmp/model-depth0.json
            /tmp/policy-lab-input.json
            /tmp/policy-lab-a.json
            /tmp/safety-frontier-input.json
            /tmp/safety-frontier-a.json
          if-no-files-found: error
