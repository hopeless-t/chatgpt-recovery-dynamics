name: Validate Purrtocol 3D preflight

on:
  push:
    paths:
      - "data/purrtocol_3d_contract.json"
      - "data/pakenya_concepts.jsonl"
      - "data/pakenya_promotions.jsonl"
      - "docs/purrtocol-3d/**"
      - "docs/assets/purrtocol/**"
      - "docs/purrtocol-design-bible.md"
      - "scripts/validate_purrtocol_3d.py"
      - ".github/workflows/validate-purrtocol-3d.yml"
  pull_request:
    paths:
      - "data/purrtocol_3d_contract.json"
      - "data/pakenya_concepts.jsonl"
      - "data/pakenya_promotions.jsonl"
      - "docs/purrtocol-3d/**"
      - "docs/assets/purrtocol/**"
      - "docs/purrtocol-design-bible.md"
      - "scripts/validate_purrtocol_3d.py"
      - ".github/workflows/validate-purrtocol-3d.yml"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate 3D concept/implementation boundary
        run: python scripts/validate_purrtocol_3d.py
