name: Validate Purrtocol Civilization

on:
  pull_request:
    paths:
      - 'scripts/purrtocol_c*.py'
      - 'scripts/purrtocol_recovery_*.py'
      - 'scripts/purrtocol_connection_amplification.py'
      - 'scripts/validate_purrtocol_civilization*.py'
      - 'data/purrtocol_civilization_chronicle.json'
      - 'docs/purrtocol-c*.md'
      - 'docs/purrtocol-civilization-history/**'
      - '.github/workflows/validate-purrtocol-civilization.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/purrtocol_c*.py'
      - 'scripts/purrtocol_recovery_*.py'
      - 'scripts/purrtocol_connection_amplification.py'
      - 'scripts/validate_purrtocol_civilization*.py'
      - 'data/purrtocol_civilization_chronicle.json'
      - 'docs/purrtocol-c*.md'
      - 'docs/purrtocol-civilization-history/**'
      - '.github/workflows/validate-purrtocol-civilization.yml'

permissions:
  contents: read

jobs:
  civilization-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile civilization surfaces
        run: python -m compileall -q scripts
      - name: Run canonical Civilization semantic suite
        run: python scripts/validate_purrtocol_civilization_suite.py
      - name: Upload civilization ledgers and references
        uses: actions/upload-artifact@v4
        with:
          name: purrtocol-civilization-v0
          path: |
            /tmp/civilization-news-a.json
            /tmp/season-a.json
            /tmp/shock-regimes-input.json
            /tmp/shock-regimes-a.json
            /tmp/c5-reference.json
            /tmp/c6-reference.json
            /tmp/c7-reference.json
          if-no-files-found: error
